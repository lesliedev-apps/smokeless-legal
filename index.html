<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smokeless - Legal Information</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.025em;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }

    .btn {
      display: block;
      padding: 14px 20px;
      background-color: transparent;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: rgba(56, 189, 248, 0.1);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    footer {
      border-top: 1px solid var(--border);
      padding-top: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    footer .app-title {
      font-weight: 600;
      color: var(--text);
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Smokeless</h1>
    <p class="subtitle">Legal Documentation & Policies</p>

    <nav class="links">
      <a href="privacy.html" class="btn">Privacy Policy</a>
      <a href="terms.html" class="btn">Terms of Service</a>
    </nav>

    <footer>
      <p class="app-title">Smokeless - Quit Smoking</p>
      <p>Developed by <strong>Markó László</strong></p>
      <p>Contact: <a href="mailto:lesliedev.help+smokeless@gmail.com">lesliedev.help+smokeless@gmail.com</a></p>
    </footer>
  </main>

</body>
</html>
